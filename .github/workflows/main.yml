name: Publish ClickOnce Auto-Update & Installer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run Unit Tests
        run: dotnet test WinFrame.sln --configuration Release

      - name: Publish Self-Contained Installer, ClickOnce Package & Landing Page
        shell: pwsh
        run: |
          $version = "1.0.0.$env:GITHUB_RUN_NUMBER"
          $publishDir = "$env:GITHUB_WORKSPACE\clickonce\"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          # 1. Publish all components to win11-x64 payload directory
          $appPub = "$env:GITHUB_WORKSPACE\publish\win11-x64"
          New-Item -ItemType Directory -Force -Path $appPub | Out-Null
          dotnet publish src/WinFrame.App/WinFrame.App.csproj -c Release -r win-x64 -o $appPub
          dotnet publish src/WinFrame.Cli/WinFrame.Cli.csproj -c Release -r win-x64 -o $appPub
          dotnet publish src/WinFrame.Service/WinFrame.Service.csproj -c Release -r win-x64 -o $appPub
          Copy-Item LICENSE "$appPub\LICENSE" -Force
          Copy-Item README.md "$appPub\README.md" -Force
          Copy-Item installer/install_windows11.ps1 "$appPub\Install.ps1" -Force
          New-Item -ItemType Directory -Force -Path "$appPub\assets" | Out-Null
          Copy-Item assets/splash.jpg "$appPub\assets\splash.jpg" -Force

          # 2. Package WinFramePayload.zip for the self-contained installer
          $zipPath = "$env:GITHUB_WORKSPACE\installer\WinFramePayload.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$appPub\*" -DestinationPath $zipPath -Force

          # 3. Publish Self-Contained Installer Wizard with embedded payload
          $instPub = "$env:GITHUB_WORKSPACE\installer_pub"
          dotnet publish src/WinFrame.Installer/WinFrame.Installer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            "-p:PublishSingleFile=true" `
            "-p:IncludeNativeLibrariesForSelfExtract=true" `
            "-p:InstallerPayloadZip=$zipPath" `
            -o $instPub

          if (Test-Path "$instPub\WinFrame.Installer.exe") {
            Copy-Item "$instPub\WinFrame.Installer.exe" "$publishDir\WinFrame.Installer.exe" -Force
          }

          # 4. Publish ClickOnce Auto-Update package
          try {
            msbuild src/WinFrame.App/WinFrame.App.csproj `
              /restore `
              /target:Publish `
              /property:Configuration=Release `
              /property:PublishProfile=GitHubPages `
              /property:ApplicationVersion=$version `
              /property:PublishDir=$publishDir
          } catch {
            Write-Warning "ClickOnce publish warning: $_"
          }

          if (Test-Path "$appPub\WinFrame.Core.dll") {
            Copy-Item "$appPub\WinFrame.Core.dll" "$publishDir\WinFrame.Core.dll" -Force
          } elseif (Test-Path "src/WinFrame.Core/bin/out/Release/net10.0-windows/win-x64/WinFrame.Core.dll") {
            Copy-Item "src/WinFrame.Core/bin/out/Release/net10.0-windows/win-x64/WinFrame.Core.dll" "$publishDir\WinFrame.Core.dll" -Force
          }

          Copy-Item .github/pages/index.html "$publishDir\index.html" -Force
          Copy-Item assets/splash.jpg "$publishDir\splash.jpg" -Force
          New-Item -ItemType File -Force -Path "$publishDir\.nojekyll" | Out-Null

          $versionMeta = @{
            version         = $version
            setupUrl        = "https://zakskywalker.github.io/winframe-automation/setup.exe"
            installerExeUrl = "https://zakskywalker.github.io/winframe-automation/WinFrame.Installer.exe"
            coreDllUrl      = "https://zakskywalker.github.io/winframe-automation/WinFrame.Core.dll"
            releaseNotes    = "WinFrame Automation Studio $version — Hand of Glory Games and Software"
            publishedAt     = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "$publishDir\version.json" -Value $versionMeta -Encoding UTF8

      - name: Upload ClickOnce & Installer Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickonce-site
          path: clickonce

      - name: Configure Pages
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: clickonce

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_config.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
