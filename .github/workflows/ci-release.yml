name: Build, Test & Release WinFrame Artifacts

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WinFrame.sln

      - name: Build Solution (Release)
        run: dotnet build WinFrame.sln -c Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test WinFrame.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Package DLL, CLI EXE, App EXE & Service EXE
        run: |
          New-Item -ItemType Directory -Force publish/dll, publish/cli, publish/app, publish/service | Out-Null
          Copy-Item src/WinFrame.Core/bin/Release/net10.0-windows/win-x64/* publish/dll/ -Recurse -Force
          dotnet publish src/WinFrame.Cli/WinFrame.Cli.csproj -c Release -o publish/cli
          dotnet publish src/WinFrame.App/WinFrame.App.csproj -c Release -o publish/app
          dotnet publish src/WinFrame.Service/WinFrame.Service.csproj -c Release -o publish/service

      - name: Upload Build Artifacts (WinFrame.Core.dll + WinFrame.Cli.exe + WinFrame.App.exe)
        uses: actions/upload-artifact@v4
        with:
          name: winframe-release-bundle
          path: publish/

